<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ROS 航点导航封面</title>
  <desc id="desc">展示 ROS 航点导航主题的封面图。</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f4fbff" />
      <stop offset="100%" stop-color="#d7eefb" />
    </linearGradient>
    <linearGradient id="card" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" rx="36" />
  <circle cx="1050" cy="110" r="90" fill="#bae6fd" opacity="0.7" />
  <circle cx="160" cy="520" r="120" fill="#99f6e4" opacity="0.45" />

  <rect x="90" y="90" width="1020" height="450" rx="28" fill="white" opacity="0.96" />
  <rect x="120" y="120" width="360" height="390" rx="24" fill="url(#card)" />

  <g fill="none" stroke="#ecfeff" stroke-linecap="round" stroke-linejoin="round" stroke-width="14">
    <path d="M185 390 L245 305 L325 350 L405 235" />
    <circle cx="185" cy="390" r="15" fill="#ecfeff" />
    <circle cx="245" cy="305" r="15" fill="#ecfeff" />
    <circle cx="325" cy="350" r="15" fill="#ecfeff" />
    <circle cx="405" cy="235" r="15" fill="#ecfeff" />
  </g>

  <g fill="#0f172a">
    <text x="540" y="220" font-size="62" font-family="Arial, Helvetica, sans-serif" font-weight="700">ROS 航点导航</text>
    <text x="540" y="290" font-size="32" font-family="Arial, Helvetica, sans-serif">move_base Action · 航点管理 · 自动巡航</text>
    <text x="540" y="390" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#334155">
      从单点目标控制到多航点任务编排
    </text>
  </g>

  <g fill="#0f766e">
    <rect x="540" y="440" width="156" height="46" rx="23" />
    <rect x="716" y="440" width="164" height="46" rx="23" fill="#0369a1" />
  </g>
  <g fill="white" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
    <text x="578" y="471">ROS1</text>
    <text x="758" y="471">Action</text>
  </g>
</svg>
